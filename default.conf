server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript text/plain application/xml image/svg+xml application/json;
  gzip_min_length 512;

  error_page 404 /404.html;

  location /images/ { expires 30d; add_header Cache-Control "public"; }
  location /fonts/ { expires 365d; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ =404; }
}
