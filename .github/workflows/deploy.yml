name: "Website · Image bauen & veröffentlichen"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Website bauen
        run: npm run build

  build-and-push:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Version im Schema Jahr.Monat.N (N = N-ter Commit auf main im Monat, UTC).
      # Das Cockpit (tools/luxstage.py) rechnet nach derselben Regel.
      - name: Version berechnen
        id: ver
        env:
          TZ: UTC
        run: |
          YM=$(git log -1 --format=%cd --date=format-local:%Y-%m)
          Y=${YM%-*}; M=${YM#*-}
          N=$(git rev-list --count --first-parent --since="$Y-$M-01T00:00:00Z" HEAD)
          V="$((10#$Y)).$((10#$M)).$N"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Log in to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin

      - name: Tags und Labels ableiten
        id: meta
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          IMG="$REGISTRY/$IMAGE_NAME"
          {
            echo "tags<<EOF"
            echo "$IMG:latest"
            echo "$IMG:$VERSION"
            echo "$IMG:${GITHUB_SHA::7}"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.version=$VERSION"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
